<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F3EB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#110D0A" media="(prefers-color-scheme: dark)" />
    <title>Zournel</title>
    <meta name="description" content="A minimalist, AI-integrated To-Do and Journaling application with intelligent task breakdown and reflective insights." />
    <meta property="og:title" content="Zournel" />
    <meta property="og:description" content="A minimalist, AI-integrated To-Do and Journaling application with intelligent task breakdown and reflective insights." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23C69C6D' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z'/%3E%3Cpolyline points='7.5 18 16.5 6'/%3E%3Cpath d='m12 12 3 3-3 3'/%3E%3Cpath d='m12 6-3 3 3 3'/%3E%3C/svg%3E">
    <script>
      try {
        const stored = localStorage.getItem('mf_settings');
        if (stored) {
          const parsed = JSON.parse(stored);
          const theme = parsed.theme || 'cozy-light';
          document.documentElement.classList.add(`theme-${theme}`);
          if (['cozy-dark', 'evergreen-dark', 'catppuccin-dark', 'gruvbox-dark'].includes(theme)) {
            document.documentElement.classList.add('dark');
          }
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.classList.add('theme-cozy-dark', 'dark');
        } else {
          document.documentElement.classList.add('theme-cozy-light');
        }
      } catch (e) {
        document.documentElement.classList.add('theme-cozy-light');
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Only the default families load at boot; other selectable fonts are fetched on demand (see App.tsx). -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300..700;1,300..700&family=Outfit:wght@400..800&family=Playfair+Display:ital,wght@0,400..800;1,400..800&family=JetBrains+Mono:wght@300..700&display=swap" rel="stylesheet">

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
