
<!DOCTYPE html>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300..700;1,300..700&family=Playfair+Display:ital,wght@0,400..800;1,400..800&family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&family=Lora:ital,wght@0,400..700;1,400..700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Space+Grotesk:wght@300..700&family=JetBrains+Mono:ital,wght@0,300..700;1,300..700&family=Syncopate:wght@400;700&family=Syne:wght@400..800&family=Cormorant+Garamond:ital,wght@0,400..700;1,400..700&family=Outfit:wght@400..800&family=Cinzel:wght@400..800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['var(--font-body)', 'Inter', 'sans-serif'],
              display: ['var(--font-heading)', 'Outfit', 'Playfair Display', 'sans-serif'],
              grotesk: ['Space Grotesk', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              bg: 'var(--color-bg)',
              surface: 'var(--color-surface)',
              'surface-highlight': 'var(--color-surface-highlight)',
              primary: 'var(--color-primary)',
              secondary: 'var(--color-secondary)',
              accent: 'var(--color-accent)',
              'accent-fg': 'var(--color-accent-fg)',
              'accent-dim': 'var(--color-accent-dim)',
            },
            animation: {
              'fade-in': 'fadeIn 0.2s cubic-bezier(0.23, 1, 0.32, 1)',
              'scale-in': 'scaleIn 0.2s cubic-bezier(0.23, 1, 0.32, 1)',
              'slide-up': 'slideUp 0.2s cubic-bezier(0.23, 1, 0.32, 1)',
            },
            transitionTimingFunction: {
              'out': 'cubic-bezier(0.23, 1, 0.32, 1)',
              'in-out': 'cubic-bezier(0.77, 0, 0.175, 1)',
            },
            keyframes: {
              fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
              scaleIn: { '0%': { transform: 'scale(0.96)', opacity: '0' }, '100%': { transform: 'scale(1)', opacity: '1' } },
              slideUp: { '0%': { transform: 'translateY(15px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
            }
          },
        },
      }
    </script>
    <style>
      :root { 
        --font-heading: 'Playfair Display', serif;
        --font-body: 'Inter', sans-serif;

        /* COZY LIGHT DEFAULT */
        --color-bg: #FAF8F4; 
        --color-surface: #FFFFFF; 
        --color-surface-highlight: #EFEAD8; 
        --color-primary: #3D352E; 
        --color-secondary: #786C60; 
        --color-accent: #C69C6D; 
        --color-accent-fg: #FFFFFF; 
        --color-accent-dim: #F7EFE1; 
      }

      body {
        font-family: var(--font-body) !important;
      }

      .theme-cozy-light { 
        --color-bg: #FAF8F4; 
        --color-surface: #FFFFFF; 
        --color-surface-highlight: #EFEAD8; 
        --color-primary: #3D352E; 
        --color-secondary: #786C60; 
        --color-accent: #C69C6D; 
        --color-accent-fg: #FFFFFF; 
        --color-accent-dim: #F7EFE1; 
      }
      
      .theme-cozy-dark { 
        --color-bg: #1B1512; 
        --color-surface: #261F1A; 
        --color-surface-highlight: #3B312A; 
        --color-primary: #F2EAE4; 
        --color-secondary: #9E8E83; 
        --color-accent: #D9AB7E; 
        --color-accent-fg: #1B1512; 
        --color-accent-dim: #2E221A; 
      }
      
      .theme-evergreen-light { 
        --color-bg: #F2F5F2; 
        --color-surface: #FFFFFF; 
        --color-surface-highlight: #DFE6DF; 
        --color-primary: #1C2E1F; 
        --color-secondary: #59735C; 
        --color-accent: #2A5C3C; 
        --color-accent-fg: #FFFFFF; 
        --color-accent-dim: #E6EFE6; 
      }
      
      .theme-evergreen-dark { 
        --color-bg: #0C140E; 
        --color-surface: #132016; 
        --color-surface-highlight: #213526; 
        --color-primary: #ECF5ED; 
        --color-secondary: #7E9B82; 
        --color-accent: #34D399; 
        --color-accent-fg: #052414; 
        --color-accent-dim: #112E1B; 
      }
      
      .theme-catppuccin-light { 
        --color-bg: #EFF1F5; 
        --color-surface: #E6E9EF; 
        --color-surface-highlight: #CCD0DA; 
        --color-primary: #4C4F69; 
        --color-secondary: #6C6F85; 
        --color-accent: #8839EF; 
        --color-accent-fg: #EFF1F5; 
        --color-accent-dim: #E8DBFC; 
      }

      .theme-catppuccin-dark { 
        --color-bg: #1E1E2E; 
        --color-surface: #181825; 
        --color-surface-highlight: #313244; 
        --color-primary: #CDD6F4; 
        --color-secondary: #A6ADC8; 
        --color-accent: #CBA6F7; 
        --color-accent-fg: #11111B; 
        --color-accent-dim: #2A203F; 
      }

      .theme-gruvbox-light { 
        --color-bg: #FBF1C7; 
        --color-surface: #F9F5D7; 
        --color-surface-highlight: #EBDBB2; 
        --color-primary: #282828; 
        --color-secondary: #665C54; 
        --color-accent: #D65D0E; 
        --color-accent-fg: #FBF1C7; 
        --color-accent-dim: #F5E0B8; 
      }

      .theme-gruvbox-dark { 
        --color-bg: #1D2021; 
        --color-surface: #282828; 
        --color-surface-highlight: #3C3836; 
        --color-primary: #FBF1C7; 
        --color-secondary: #A89984; 
        --color-accent: #FE8019; 
        --color-accent-fg: #1D2021; 
        --color-accent-dim: #3A2312; 
      }

      /* Custom background subtle micro-textures for added premium feel */
      .theme-cozy-light body {
        background-image: radial-gradient(rgba(198, 156, 109, 0.05) 1.5px, transparent 1.5px);
        background-size: 24px 24px;
      }
      .theme-cozy-dark body {
        background-image: radial-gradient(rgba(217, 171, 126, 0.04) 1.5px, transparent 1.5px);
        background-size: 24px 24px;
      }
      .theme-gruvbox-dark body {
        background-image: radial-gradient(rgba(251, 241, 199, 0.03) 1.5px, transparent 1.5px);
        background-size: 24px 24px;
      }
      .theme-catppuccin-dark body {
        background-image: radial-gradient(at 0% 0%, rgba(136, 57, 239, 0.06) 0px, transparent 50%), radial-gradient(at 100% 100%, rgba(203, 166, 247, 0.04) 0px, transparent 50%);
        background-attachment: fixed;
      }
      .theme-evergreen-dark body {
        background-image: radial-gradient(at 0% 0%, rgba(52, 211, 153, 0.06) 0px, transparent 50%), radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.03) 0px, transparent 50%);
        background-attachment: fixed;
      }

      html, body { height: 100%; min-height: 100vh; background-color: var(--color-bg); color: var(--color-primary); transition: background-color 0.8s cubic-bezier(0.2, 0, 0, 1), color 0.8s ease; scroll-behavior: smooth; }
      
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      .milkdown {
        background: transparent !important;
        box-shadow: none !important;
        color: var(--color-primary) !important;
        border: none !important;
      }
      .milkdown .editor {
        font-family: var(--font-body), sans-serif !important;
        font-size: 1.25rem !important;
        line-height: 1.8 !important;
        color: var(--color-primary) !important;
        padding: 0 !important;
        outline: none !important;
        border: none !important;
        box-shadow: none !important;
      }

      /* Explicit Typography & Headings Styling for Milkdown */
      .milkdown .editor h1,
      .milkdown h1,
      .ProseMirror h1 {
        font-family: var(--font-heading), serif !important;
        font-size: 2.25rem !important;
        font-weight: 700 !important;
        line-height: 1.25 !important;
        margin-top: 1.5rem !important;
        margin-bottom: 0.75rem !important;
        color: var(--color-primary) !important;
        display: block !important;
      }

      .milkdown .editor h2,
      .milkdown h2,
      .ProseMirror h2 {
        font-family: var(--font-heading), serif !important;
        font-size: 1.75rem !important;
        font-weight: 600 !important;
        line-height: 1.3 !important;
        margin-top: 1.25rem !important;
        margin-bottom: 0.5rem !important;
        color: var(--color-primary) !important;
        display: block !important;
      }

      .milkdown .editor h3,
      .milkdown h3,
      .ProseMirror h3 {
        font-family: var(--font-heading), serif !important;
        font-size: 1.35rem !important;
        font-weight: 600 !important;
        line-height: 1.35 !important;
        margin-top: 1rem !important;
        margin-bottom: 0.5rem !important;
        color: var(--color-primary) !important;
        display: block !important;
      }

      .milkdown .editor p,
      .ProseMirror p {
        margin-bottom: 0.75rem !important;
      }

      .milkdown .editor strong,
      .milkdown .editor b,
      .ProseMirror strong,
      .ProseMirror b {
        font-weight: 700 !important;
        color: var(--color-primary) !important;
      }

      .milkdown .editor em,
      .milkdown .editor i,
      .ProseMirror em,
      .ProseMirror i {
        font-style: italic !important;
      }

      .milkdown .editor hr,
      .milkdown hr,
      .ProseMirror hr {
        border: none !important;
        border-top: 2px dashed var(--color-accent) !important;
        margin: 1.75rem 0 !important;
        opacity: 0.6 !important;
        display: block !important;
      }

      /* Explicit List Styling for Milkdown */
      .milkdown .editor ul,
      .ProseMirror ul {
        list-style-type: disc !important;
        padding-left: 1.75rem !important;
        margin: 1rem 0 !important;
      }
      .milkdown .editor ol,
      .ProseMirror ol {
        list-style-type: decimal !important;
        padding-left: 1.75rem !important;
        margin: 1rem 0 !important;
      }
      .milkdown .editor li,
      .ProseMirror li {
        margin-bottom: 0.5rem !important;
      }
      .milkdown .editor del, .milkdown .editor s,
      .ProseMirror del, .ProseMirror s {
        text-decoration: line-through !important;
        opacity: 0.6 !important;
      }
      
      .milkdown .editor code,
      .ProseMirror code {
        font-family: 'JetBrains Mono', monospace !important;
        background: var(--color-surface-highlight) !important;
        color: var(--color-accent) !important;
        padding: 0.2rem 0.5rem !important;
        border-radius: 0.4rem !important;
        font-size: 0.85em !important;
      }

      .milkdown .editor pre,
      .ProseMirror pre {
        background: var(--color-surface-highlight) !important;
        padding: 1rem !important;
        border-radius: 0.75rem !important;
        overflow-x: auto !important;
        margin: 1rem 0 !important;
      }

      .milkdown .editor pre code,
      .ProseMirror pre code {
        background: transparent !important;
        padding: 0 !important;
        color: var(--color-primary) !important;
      }

      /* Explicit Blockquote / Quote Styling for Milkdown (Italicized Sans-Serif Font) */
      .milkdown .editor blockquote,
      blockquote {
        border-left: 4px solid var(--color-accent) !important;
        padding: 0.6rem 1.25rem !important;
        margin: 1rem 0 !important;
        font-family: 'Plus Jakarta Sans', 'Inter', sans-serif !important;
        font-style: italic !important;
        font-weight: 500 !important;
        color: var(--color-secondary) !important;
        background: rgba(198, 156, 109, 0.08) !important;
        border-radius: 0 0.75rem 0.75rem 0 !important;
      }

      .milkdown .editor blockquote p,
      blockquote p {
        font-family: 'Plus Jakarta Sans', 'Inter', sans-serif !important;
        font-style: italic !important;
        margin: 0 !important;
        line-height: 1.6 !important;
      }

      .ProseMirror {
        outline: none !important;
        border: none !important;
      }

      .hover-lift {
        transition: transform 0.2s cubic-bezier(0.3, 0, 0, 1.1), box-shadow 0.2s ease;
      }
      .hover-lift:hover {
        transform: translateY(-4px);
      }

      /* Soften borders in dark mode */
      html.dark .border, 
      html.dark .border-b, 
      html.dark .border-t, 
      html.dark .border-l, 
      html.dark .border-r {
        border-color: rgba(255, 255, 255, 0.05) !important;
      }
      
      html.dark input.border,
      html.dark textarea.border {
         border-color: rgba(255, 255, 255, 0.08) !important;
      }

      /* Responsive Display Typography & Syncopate Font Optimization */
      .font-display {
        font-family: var(--font-heading), 'Outfit', 'Playfair Display', sans-serif;
        word-break: break-word;
        overflow-wrap: anywhere;
      }

      /* Responsive kerning & tracking for Syncopate (Wide Upper Display Font) */
      [data-heading-font="syncopate"] .font-display,
      .font-syncopate {
        letter-spacing: -0.02em;
        line-height: 1.1;
        text-transform: uppercase;
      }
      @media (min-width: 640px) {
        [data-heading-font="syncopate"] .font-display,
        .font-syncopate {
          letter-spacing: 0.03em;
          line-height: 1.15;
        }
      }
      @media (min-width: 1024px) {
        [data-heading-font="syncopate"] .font-display,
        .font-syncopate {
          letter-spacing: 0.07em;
          line-height: 1.2;
        }
      }

      /* Avant-garde & Cinematic Display tweaks */
      [data-heading-font="syne"] .font-display {
        letter-spacing: -0.02em;
      }
      [data-heading-font="cinzel"] .font-display {
        letter-spacing: 0.04em;
      }

      /* AI Glitter Highlight & Typewriter Micro-Interactions */
      @keyframes aiGlitterSweep {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      @keyframes aiPulseGlow {
        0%, 100% { box-shadow: 0 0 8px rgba(198, 156, 109, 0.2), inset 0 0 12px rgba(198, 156, 109, 0.15); }
        50% { box-shadow: 0 0 20px rgba(198, 156, 109, 0.5), inset 0 0 20px rgba(198, 156, 109, 0.3); }
      }
      @keyframes sparkleSpinFloat {
        0% { transform: scale(0.6) rotate(0deg) translateY(0); opacity: 0.3; }
        50% { transform: scale(1.3) rotate(180deg) translateY(-4px); opacity: 1; }
        100% { transform: scale(0.8) rotate(360deg) translateY(-8px); opacity: 0; }
      }
      @keyframes typewriterCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
      }

      .ai-glitter-highlight {
        background: linear-gradient(
          90deg,
          rgba(198, 156, 109, 0.1) 0%,
          rgba(198, 156, 109, 0.4) 30%,
          rgba(255, 235, 205, 0.7) 50%,
          rgba(198, 156, 109, 0.4) 70%,
          rgba(198, 156, 109, 0.1) 100%
        );
        background-size: 200% 100%;
        animation: aiGlitterSweep 2s infinite linear;
        border-radius: 0.5rem;
      }

      .ai-glitter-text {
        background: linear-gradient(
          120deg,
          var(--color-primary) 20%,
          var(--color-accent) 45%,
          #FFF 50%,
          var(--color-accent) 55%,
          var(--color-primary) 80%
        );
        background-size: 200% auto;
        color: transparent;
        -webkit-background-clip: text;
        background-clip: text;
        animation: aiGlitterSweep 3s ease infinite;
      }

      .ai-typewriter-cursor {
        display: inline-block;
        width: 2px;
        height: 1.1em;
        background-color: var(--color-accent);
        margin-left: 2px;
        vertical-align: middle;
        animation: typewriterCursor 0.8s infinite ease-in-out;
      }
    </style>
